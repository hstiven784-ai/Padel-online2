<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pádel Online</title>
<style>
:root{--bg:#f4f6f8;--fg:#14212b;--card:#fff;--ac:#1f7a4d;--mut:#5b6b77;--court:#2b6fb3}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--fg:#e8eef3;--card:#1a242c;--ac:#3fb67c;--mut:#93a4b0;--court:#1d4f82}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;text-align:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:420px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;margin:4px}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--mut)}
input{padding:11px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font-size:1rem;width:7.5em;text-transform:uppercase;text-align:center}
.code{font-size:2rem;letter-spacing:.2em;font-weight:700;color:var(--ac)}
#qr{display:inline-block;background:#fff;padding:8px;border-radius:8px;margin:8px}
#st{color:var(--mut);min-height:1.4em}
canvas{width:100%;max-width:360px;border-radius:12px;touch-action:none;display:block;margin:8px auto}
.hide{display:none}
</style></head><body><main>
<h1>🎾 Pádel Online</h1>
<div id="lobby">
 <div class="card"><button id="bCrear">Crear partida online</button>
  <div id="host" class="hide"><div class="code" id="cod"></div><div id="qr"></div>
  <p style="color:var(--mut);font-size:.85rem">Tu rival escanea el QR o escribe el código.</p></div></div>
 <div class="card"><input id="inp" maxlength="4" placeholder="CÓDIGO"><button id="bUnir">Unirme</button></div>
 <div class="card"><button class="alt" id="bBot">Jugar solo vs bot</button></div>
</div>
<div id="st">Elige cómo jugar</div>
<canvas id="cv" class="hide" width="300" height="450"></canvas>
<div id="end" class="hide"><button id="bAgain">Revancha</button><button class="alt" id="bMenu">Salir</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="game.js"></script>
<script>
const {W,H,PW,PH,R}=Padel,$=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
let ws=null,mode=null,side=1,S=Padel.create(),meX=W/2,last=0,lastTx=0,running=false;
const status=t=>$('st').textContent=t;
function connect(cb){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=cb;
  ws.onerror=()=>status('Sin conexión con el servidor');
  ws.onclose=()=>{if(mode==='online'&&running)status('Conexión perdida')};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='room'){$('cod').textContent=m.code;$('host').classList.remove('hide');
      $('qr').innerHTML='';const url=location.origin+location.pathname+'?c='+m.code;
      try{new QRCode($('qr'),{text:url,width:170,height:170})}catch(_){}status('Esperando rival…')}
    else if(m.t==='start'){side=m.side;S=Padel.create();begin('online')}
    else if(m.t==='s'){Object.assign(S,{bx:m.bx,by:m.by,vx:m.vx,vy:m.vy,p1:m.p1,p2:m.p2,s1:m.s1,s2:m.s2,wait:m.wait,over:m.over});$('end').classList.toggle('hide',!m.over)}
    else if(m.t==='err')status(m.msg);
    else if(m.t==='left'){running=false;status('Tu rival se fue');$('end').classList.remove('hide');$('bAgain').classList.add('hide')}
  };
}
function begin(md){
  mode=md;running=true;$('lobby').classList.add('hide');cv.classList.remove('hide');
  $('bAgain').classList.remove('hide');$('end').classList.add('hide');
  status(md==='solo'?'Solo vs bot · gana el primero a 7':'¡Rival conectado! Gana el primero a 7');
  last=performance.now();requestAnimationFrame(loop);
}
function loop(now){
  if(!running)return;
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(mode==='solo'){S.p1=meX;Padel.step(S,dt,true);$('end').classList.toggle('hide',!S.over)}
  else{
    if(S.wait<=0&&!S.over){S.bx+=S.vx*dt;S.by+=S.vy*dt}
    if(now-lastTx>33&&ws&&ws.readyState===1){lastTx=now;ws.send(JSON.stringify({t:'p',x:meX}))}
  }
  draw();requestAnimationFrame(loop);
}
function draw(){
  const f=mode==='online'&&side===2,X=x=>f?W-x:x,Y=y=>f?H-y:y;
  const c=getComputedStyle(document.documentElement).getPropertyValue('--court');
  cx.fillStyle=c;cx.fillRect(0,0,W,H);cx.strokeStyle='#fff';cx.lineWidth=2;cx.strokeRect(2,2,W-4,H-4);
  cx.beginPath();cx.moveTo(W/2,H/2-110);cx.lineTo(W/2,H/2+110);cx.stroke();
  cx.setLineDash([4,5]);cx.beginPath();cx.moveTo(0,H/2);cx.lineTo(W,H/2);cx.stroke();cx.setLineDash([]);
  const mine=f?S.p2:S.p1,opp=f?S.p1:S.p2;
  cx.fillStyle='#ffd54f';cx.fillRect(X(opp)-PW/2,30-PH/2,PW,PH);
  cx.fillStyle='#ff7043';cx.fillRect(X(meX)-PW/2,H-30-PH/2,PW,PH);
  cx.fillStyle='#e8f24a';cx.beginPath();cx.arc(X(S.bx),Y(S.by),R,0,7);cx.fill();
  const my=f?S.s2:S.s1,op=f?S.s1:S.s2;
  cx.fillStyle='#fff';cx.font='bold 22px system-ui';cx.textAlign='left';cx.fillText(op,10,H/2-10);cx.fillText(my,10,H/2+28);
  cx.textAlign='center';
  if(S.over){cx.fillStyle='#000a';cx.fillRect(0,H/2-40,W,80);cx.fillStyle='#fff';cx.fillText(my>op?'¡Ganaste! 🏆':'Perdiste 😅',W/2,H/2+8)}
  else if(S.wait>0){cx.font='16px system-ui';cx.fillText('¡Prepárate!',W/2,H/2-30)}
}
function mv(e){
  const r=cv.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*W;
  if(mode==='online'&&side===2)x=W-x;
  meX=Math.max(PW/2,Math.min(W-PW/2,x));
}
cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
$('bCrear').onclick=()=>{status('Conectando…');connect(()=>ws.send(JSON.stringify({t:'create'})))};
const join=c=>{status('Conectando…');connect(()=>ws.send(JSON.stringify({t:'join',code:c})))};
$('bUnir').onclick=()=>{const c=$('inp').value.trim();c.length===4?join(c):status('Escribe el código de 4 letras')};
$('bBot').onclick=()=>{S=Padel.create();begin('solo')};
$('bAgain').onclick=()=>{if(mode==='solo'){S=Padel.create();$('end').classList.add('hide')}else ws.send(JSON.stringify({t:'again'}))};
$('bMenu').onclick=()=>location.href=location.pathname;
const q=new URLSearchParams(location.search).get('c');if(q&&q.length===4)join(q);
</script></main></body></html>
