<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pádel Online</title>
<style>
:root{--bg:#0b1622;--card:#14263a;--fg:#eaf2f8;--mut:#8fa6b8;--lime:#c6ff3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;min-height:100vh;
background:radial-gradient(circle at 50% -10%,#1d4b7a 0,#0b1622 60%) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:420px;margin:0 auto;padding:14px}
h1{font-size:1.7rem;margin:8px 0 12px;letter-spacing:.5px}
.card{background:linear-gradient(160deg,#18304a,#112235);border:1px solid #ffffff14;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 8px 24px #0006}
button{background:linear-gradient(135deg,#c6ff3d,#72d22a);color:#0b1b12;font-weight:700;border:0;border-radius:12px;padding:12px 18px;font-size:1rem;margin:4px;box-shadow:0 4px 14px #72d22a55;cursor:pointer}
button:active{transform:scale(.97)}
button.alt{background:transparent;color:var(--fg);border:1px solid #ffffff44;box-shadow:none}
button.em{background:#ffffff14;box-shadow:none;padding:6px 12px;font-size:1.4rem;border-radius:50%}
input,select{padding:12px;border-radius:12px;border:1px solid #ffffff2a;background:#0b1622;color:var(--fg);font-size:1rem;margin:4px;max-width:100%}
#inp{width:7.5em;text-transform:uppercase;text-align:center;letter-spacing:.2em;font-weight:700}
.code{font-size:2.2rem;letter-spacing:.25em;font-weight:800;color:var(--lime);text-shadow:0 0 18px #c6ff3d66}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:12px;margin:8px}
#st,#tm{color:var(--mut);min-height:1.4em;font-size:.9rem;padding:0 8px}
canvas{width:100%;max-width:360px;border-radius:18px;touch-action:none;display:block;margin:10px auto;box-shadow:0 12px 34px #000a;border:3px solid #ffffff33}
.hide{display:none}
</style></head><body><main>
<h1>🎾 Pádel Online</h1>
<div id="lobby">
 <div class="card"><input id="nom" maxlength="12" placeholder="Tu nombre"></div>
 <div class="card"><select id="mode"><option value="2">1 contra 1</option><option value="4">Dobles 2 contra 2</option></select>
  <button id="bCrear">Crear partida online</button>
  <div id="host" class="hide"><div class="code" id="cod"></div><div id="qr"></div>
  <p style="color:var(--mut);font-size:.85rem">Tus rivales y compañeros escanean el QR o escriben el código.</p></div></div>
 <div class="card"><input id="inp" maxlength="4" placeholder="CÓDIGO"><button id="bUnir">Unirme</button></div>
 <div class="card"><select id="lvl"><option value="80">Bot fácil</option><option value="130" selected>Bot medio</option><option value="200">Bot difícil</option></select>
  <button class="alt" id="bBot">Jugar solo</button></div>
</div>
<div id="st">Elige cómo jugar</div>
<canvas id="cv" class="hide" width="300" height="450"></canvas>
<div id="tm"></div>
<div id="ems" class="hide"><button class="em">👏</button><button class="em">🔥</button><button class="em">😅</button><button class="em">😎</button></div>
<div id="end" class="hide"><button id="bAgain">Revancha</button><button class="alt" id="bMenu">Salir</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="game.js"></script>
<script>
const {W,H,PW,PH,R}=Padel,$=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
{const d=Math.min(window.devicePixelRatio||1,3);cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
let ws=null,mode='',side=1,idx=0,S=Padel.create(),meX=W/2,last=0,lastTx=0,running=false,botSp=130,pv={vx:0,vy:0,sA:0,sB:0},ems=[],wins=[0,0];
try{$('nom').value=localStorage.padelName||''}catch(_){}
const name=()=>{const n=$('nom').value.trim()||'Jugador';try{localStorage.padelName=n}catch(_){}return n};
const status=t=>$('st').textContent=t,tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
let ac=null;
function beep(f,d,v=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(_){}}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(_){}};
function track(){
  if(S.sA!==pv.sA||S.sB!==pv.sB){beep(220,.35);vib(120)}
  else if(Math.sign(S.vy)!==Math.sign(pv.vy)&&S.vy&&pv.vy){(S.by<40||S.by>H-40)?beep(900,.12,.2):beep(660,.08);vib(25);fxs.push({x:S.bx,y:S.by,t:performance.now()})}
  else if(Math.sign(S.vx)!==Math.sign(pv.vx)&&S.vx&&pv.vx)beep(440,.05,.08);
  pv={vx:S.vx,vy:S.vy,sA:S.sA,sB:S.sB};
}
function connect(cb){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=cb;ws.onerror=()=>status('Sin conexión con el servidor');
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='room'){$('cod').textContent=m.code;$('host').classList.remove('hide');
      $('qr').innerHTML='';const url=location.origin+location.pathname+'?c='+m.code;
      try{new QRCode($('qr'),{text:url,width:170,height:170})}catch(_){}}
    else if(m.t==='wait')status('Esperando jugadores '+m.n+'/'+m.mode+'…');
    else if(m.t==='start'){side=m.side;idx=m.idx;S=Padel.create();wins=[0,0];
      $('tm').textContent=m.names.map((n,i)=>(i%2?'🟡 ':'🟠 ')+n).join(' · ');begin('online')}
    else if(m.t==='s'){Object.assign(S,m);wins=m.w;$('end').classList.toggle('hide',!m.over)}
    else if(m.t==='e')ems.push({e:m.e,x:60+Math.random()*180,t:performance.now()});
    else if(m.t==='err')status(m.msg);
    else if(m.t==='left'){running=false;status('Alguien se fue. Partida terminada.');$('end').classList.remove('hide');$('bAgain').classList.add('hide')}
  };
}
function begin(md){
  mode=md;running=true;$('lobby').classList.add('hide');cv.classList.remove('hide');$('ems').classList.remove('hide');
  $('bAgain').classList.remove('hide');$('end').classList.add('hide');
  pv={vx:0,vy:0,sA:0,sB:0};last=performance.now();status('Si la pelota rebota en tu cristal del fondo, ¡devuélvela antes de que se te escape! Gana el primero a 3');requestAnimationFrame(loop);
}
function loop(now){
  if(!running)return;
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(mode==='solo'){S.A[0]=meX;Padel.step(S,dt,botSp);$('end').classList.toggle('hide',!S.over)}
  else{
    if(S.wait<=0&&!S.over){S.bx+=S.vx*dt;S.by=Math.max(0,Math.min(H,S.by+S.vy*dt))}
    if(now-lastTx>33){lastTx=now;tx({t:'p',x:meX})}
  }
  track();draw(now);requestAnimationFrame(loop);
}
let trail=[],fxs=[],pm={};
function rr(x,y,w,h,r){cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)}
function man(px,py,col,back,own,tx,ty,now,mv){
  const w=mv?Math.sin(now/55)*4:0,dir=tx>=px?1:-1,near=Math.max(0,1-Math.abs(ty-py)/70);
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(px,py+17,14,5,0,0,7);cx.fill();
  if(own){cx.strokeStyle='#c6ff3d';cx.lineWidth=2;cx.beginPath();cx.ellipse(px,py+17,18,6.5,0,0,7);cx.stroke()}
  cx.fillStyle='#1b2a44';cx.fillRect(px-6,py+6,5,10+w*.5);cx.fillRect(px+1,py+6,5,10-w*.5);
  cx.fillStyle='#fff';cx.fillRect(px-7,py+15+w*.5,7,3);cx.fillRect(px,py+15-w*.5,7,3);
  rr(px-9,py-9,18,17,6);cx.fillStyle=col;cx.fill();
  cx.fillStyle='#1b2a44';cx.fillRect(px-8,py+5,16,4);
  const hx=px+Math.max(-17,Math.min(17,(tx-px)*.6)),hy=py+(back?-2:3);
  cx.strokeStyle='#f1c9a0';cx.lineWidth=4;cx.lineCap='round';cx.beginPath();cx.moveTo(px+dir*9,py-5);cx.lineTo(hx,hy);cx.stroke();
  cx.save();cx.translate(hx,hy);cx.rotate(dir*(-.7+near*1.3));cx.scale(1,back?1:-1);
  cx.fillStyle='#333';cx.fillRect(-1.5,-9,3,9);
  cx.beginPath();cx.ellipse(0,-17,7.5,9.5,0,0,7);cx.fillStyle='#e0453a';cx.fill();cx.strokeStyle='#fff';cx.lineWidth=1.5;cx.stroke();
  cx.fillStyle='rgba(255,255,255,.35)';cx.beginPath();cx.ellipse(-2,-19,2.5,3.5,0,0,7);cx.fill();cx.restore();
  cx.fillStyle='#f1c9a0';cx.beginPath();cx.arc(px,py-16,7,0,7);cx.fill();
  if(back){cx.fillStyle='#2b2b2b';cx.beginPath();cx.arc(px,py-16.5,7.3,0,7);cx.fill();cx.fillStyle=col;cx.fillRect(px-7,py-18,14,2.5)}
  else{cx.fillStyle='#2b2b2b';cx.beginPath();cx.arc(px,py-16,7.3,Math.PI,0);cx.fill();cx.fillRect(px-2.7,py-15.5,1.8,1.8);cx.fillRect(px+1,py-15.5,1.8,1.8)}
}
function draw(now){
  const f=mode==='online'&&side===2,X=x=>f?W-x:x,Y=y=>f?H-y:y;
  const my=f?S.sB:S.sA,op=f?S.sA:S.sB;
  let g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a5a9e');g.addColorStop(.5,'#2a82d6');g.addColorStop(1,'#1a5a9e');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<W;i+=40)cx.fillRect(i,0,20,H);
  cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=2;cx.strokeRect(12,16,W-24,H-32);
  cx.beginPath();cx.moveTo(12,H/2-90);cx.lineTo(W-12,H/2-90);cx.moveTo(12,H/2+90);cx.lineTo(W-12,H/2+90);cx.moveTo(W/2,H/2-90);cx.lineTo(W/2,H/2+90);cx.stroke();
  cx.fillStyle='rgba(255,255,255,.11)';cx.font='bold 120px system-ui';cx.textAlign='center';
  cx.fillText(op,W/2,H/2-55);cx.fillText(my,W/2,H/2+150);
  cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(0,H/2,W,6);cx.fillStyle='#eef3f7';cx.fillRect(0,H/2-3,W,3);
  cx.fillStyle='rgba(255,255,255,.5)';for(let i=6;i<W;i+=12)cx.fillRect(i,H/2-3,1,3);
  g=cx.createLinearGradient(0,0,0,12);g.addColorStop(0,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,.05)');
  cx.fillStyle=g;cx.fillRect(0,0,W,12);cx.save();cx.translate(0,H);cx.scale(1,-1);cx.fillRect(0,0,W,12);cx.restore();
  cx.fillStyle='rgba(255,255,255,.14)';cx.fillRect(0,0,4,H);cx.fillRect(W-4,0,4,H);
  const myTeam=f?S.B:S.A,oppTeam=f?S.A:S.B;
  cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(X(S.bx),Y(S.by)+7,R,3,0,0,7);cx.fill();
  for(const team of [oppTeam,myTeam]){
    const y=team===S.A?H-30:30,mine=team===myTeam;
    team.forEach((x,i)=>{const own=mine&&i===idx,px=X(own?meX:x),k=(team===S.A?'a':'b')+i,mv=Math.abs(px-(pm[k]??px))>.6;pm[k]=px;
      man(px,Y(y),mine?(own?'#ff8a3d':'#ffb27a'):'#e9edf7',mine,own,X(S.bx),Y(S.by),now,mv)});
  }
  if(S.wait<=0&&!S.over){trail.push([X(S.bx),Y(S.by)]);if(trail.length>9)trail.shift()}else trail=[];
  trail.forEach((p,i)=>{cx.fillStyle='rgba(198,255,61,'+(i/trail.length*.3)+')';cx.beginPath();cx.arc(p[0],p[1],R*(.4+i/trail.length*.5),0,7);cx.fill()});
  fxs=fxs.filter(e=>now-e.t<380);
  fxs.forEach(e=>{const a=(now-e.t)/380;cx.strokeStyle='rgba(255,255,255,'+(1-a)+')';cx.lineWidth=2;cx.beginPath();cx.arc(X(e.x),Y(e.y),6+a*20,0,7);cx.stroke()});
  cx.save();cx.shadowColor='#c6ff3d';cx.shadowBlur=14;
  g=cx.createRadialGradient(X(S.bx)-2,Y(S.by)-2,1,X(S.bx),Y(S.by),R);g.addColorStop(0,'#f4ffb0');g.addColorStop(1,'#b6f021');
  cx.fillStyle=g;cx.beginPath();cx.arc(X(S.bx),Y(S.by),R,0,7);cx.fill();cx.restore();
  g=cx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.3)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.textAlign='center';
  if(mode==='online'){cx.fillStyle='rgba(255,255,255,.85)';cx.font='12px system-ui';cx.fillText('Victorias '+(f?wins[1]:wins[0])+' - '+(f?wins[0]:wins[1]),W/2,H/2+24)}
  ems=ems.filter(m=>now-m.t<1600);
  ems.forEach(m=>{cx.font='30px system-ui';cx.fillText(m.e,m.x,H/2-(now-m.t)/12)});
  if(S.over||S.wait>0){
    cx.fillStyle='rgba(6,14,22,.72)';rr(30,H/2-46,W-60,92,16);cx.fill();cx.fillStyle='#fff';
    if(S.over){cx.font='bold 26px system-ui';cx.fillText(my>op?'¡Ganaste! 🏆':'Perdiste 😅',W/2,H/2+9)}
    else{cx.font='bold 20px system-ui';cx.fillText('¡Prepárate!',W/2,H/2+7)}
  }
}
function mv(e){
  const r=cv.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*W;
  if(mode==='online'&&side===2)x=W-x;
  meX=Math.max(PW/2,Math.min(W-PW/2,x));
}
cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
$('bCrear').onclick=()=>{status('Conectando…');connect(()=>tx({t:'create',mode:+$('mode').value,name:name()}))};
const join=c=>{status('Conectando…');connect(()=>tx({t:'join',code:c,name:name()}))};
$('bUnir').onclick=()=>{const c=$('inp').value.trim();c.length===4?join(c):status('Escribe el código de 4 letras')};
$('bBot').onclick=()=>{botSp=+$('lvl').value;S=Padel.create();side=1;idx=0;begin('solo')};
$('bAgain').onclick=()=>{if(mode==='solo'){S=Padel.create();$('end').classList.add('hide')}else tx({t:'again'})};
$('bMenu').onclick=()=>location.href=location.pathname;
$('ems').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(mode==='online')tx({t:'e',e:b.textContent});else ems.push({e:b.textContent,x:150,t:performance.now()})});
const q=new URLSearchParams(location.search).get('c');if(q&&q.length===4)$('inp').value=q.toUpperCase();
</script></main></body></html>
